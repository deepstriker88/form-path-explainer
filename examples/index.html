<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="개인정보를 전송하지 않고 JSON 폼 오류 경로를 검사하는 무료 브라우저 도구"><title>Form Path Explainer — JSON 폼 검사</title><style>*{box-sizing:border-box}body{font:16px/1.5 system-ui;margin:0;background:#f5f7fb;color:#172236}header,main{max-width:1050px;margin:auto;padding:20px}h1{font-size:clamp(1.5rem,4vw,2.4rem)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.panel{background:#fff;border:1px solid #d8e0eb;border-radius:12px;padding:16px;min-width:0}label{display:block;font-weight:700;margin-bottom:8px}textarea{width:100%;min-height:240px;padding:12px;border:1px solid #8997ad;border-radius:8px;font:14px/1.5 monospace}button{margin:16px 0;padding:12px 20px;min-height:44px;border:0;border-radius:8px;background:#1747c4;color:#fff;font-weight:700;cursor:pointer}button:focus-visible,textarea:focus-visible{outline:3px solid #eaa72c;outline-offset:2px}pre{white-space:pre-wrap;overflow-wrap:anywhere}details{margin:20px 0}@media(max-width:720px){.grid{grid-template-columns:1fr}header,main{padding:14px}textarea{min-height:170px}button{width:100%}}</style></head><body><header><h1>Form Path Explainer</h1><p>JSON 데이터와 검사 규칙을 비교해 오류 위치를 확인하세요. 데이터는 브라우저 밖으로 전송되지 않습니다.</p></header><main><div class="grid"><section class="panel"><label for="data">검사할 JSON 데이터</label><textarea id="data" spellcheck="false">{"email":"bad","age":"twenty"}</textarea></section><section class="panel"><label for="schema">검사 규칙(JSON)</label><textarea id="schema" spellcheck="false">{"type":"object","required":["email"],"properties":{"email":{"type":"string","format":"email"},"age":{"type":"number"}}}</textarea></section></div><button id="run">무료 검사</button> <button id="infer" type="button">예시 데이터로 규칙 생성</button><p>규칙 생성은 검토용 초안이며 이메일 형식이나 업무별 허용 범위는 자동으로 추측하지 않습니다</p><p id="status" role="status" aria-live="polite">검사 대기</p><section class="panel"><h2>검사 결과</h2><pre id="result" aria-label="검사 결과">검사 버튼을 누르세요</pre></section><details><summary>지원 범위와 제한</summary><p>객체·배열·문자열·숫자·불리언, 필수 항목 및 일부 형식 지원. JSON Schema 전체 구현은 아닙니다. 입력당 최대 1MiB</p></details></main><script type="module">import {validateJson,explainError} from '../src/index.js';import {inferFormSchema} from '../src/infer.js';document.querySelector('#run').addEventListener('click',()=>{const out=document.querySelector('#result'),status=document.querySelector('#status');try{const r=validateJson(document.querySelector('#data').value,document.querySelector('#schema').value);status.textContent=r.valid?'검사 통과':'오류 '+r.errors.length+'건';out.textContent=r.valid?'검사 통과':r.errors.map(e=>e.path+' — '+e.code+' — '+explainError(e,'ko')).join('\n')}catch(e){status.textContent='입력 오류';out.textContent=e.message}});document.querySelector('#infer').addEventListener('click',()=>{const schema=document.querySelector('#schema'),data=document.querySelector('#data'),status=document.querySelector('#status');try{if(new TextEncoder().encode(data.value).length>1048576)throw new RangeError('input too large');const sample=JSON.parse(data.value);const rows=Array.isArray(sample)?sample:[sample];const inferred=inferFormSchema(rows);schema.value=JSON.stringify(inferred.schema,null,2);status.textContent='규칙 초안 생성 완료 — 실제 적용 전 검사 조건을 검토하세요';}catch(e){status.textContent='규칙 초안 생성 실패: '+(e.code??'JSON 입력을 확인하세요')}});</script></body></html>
