services:
  form-path-cloud:
    build:
      context: ..
      dockerfile: hosted/Dockerfile
    container_name: form-path-cloud
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "8787"
      DB_PATH: /data/commerce.sqlite
      BASE_URL: https://form-path.eztoolgo.duckdns.org
    volumes:
      - form-path-cloud-data:/data
    cpus: "0.25"
    mem_limit: 256m
    mem_reservation: 64m
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - my_network

volumes:
  form-path-cloud-data:

networks:
  my_network:
    external: true
